name: Deploy Cloud to DigitalOcean App Platform

on:
  push:
    branches:
      - main
    paths:
      - 'cloud/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch deploy credentials from KMS
        id: kms
        env:
          HANZO_API_KEY: ${{ secrets.HANZO_API_KEY }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
        run: |
          response=$(curl -sf "${KMS_ENDPOINT}/api/v1/secrets/raw?secretPath=/deploy&environment=production" \
            -H "Authorization: Bearer ${HANZO_API_KEY}" 2>/dev/null || echo "")
          if [ -n "$response" ]; then
            token=$(echo "$response" | jq -r '.secrets[] | select(.secretKey=="DO_API_TOKEN") | .secretValue // empty')
          fi
          if [ -z "${token:-}" ]; then
            echo "::error::Deploy credentials not found. Set HANZO_API_KEY with KMS access."
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ steps.kms.outputs.token }}

      - name: Deploy to DigitalOcean App Platform
        run: |
          # Check if app exists
          if doctl apps list --format ID,Spec.Name --no-header | grep -q "hanzo-cloud"; then
            echo "Updating existing app..."
            APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep "hanzo-cloud" | awk '{print $1}')
            doctl apps update $APP_ID --spec cloud/.do/app.yaml
          else
            echo "Creating new app..."
            doctl apps create --spec cloud/.do/app.yaml
          fi

      - name: Wait for deployment
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep "hanzo-cloud" | awk '{print $1}')
          echo "Waiting for deployment to complete..."
          sleep 30
          doctl apps get $APP_ID --format DefaultIngress
